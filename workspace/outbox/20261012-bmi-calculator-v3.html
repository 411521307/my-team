<!DOCTYPE html>
<!-- Handoff: Fixed 3 v3 polish items: dynamic document.title per language, localized placeholders via data-i18n-placeholder, and WHO-aligned Japanese terms (正常 / 過体重); ready to use. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator 🧮</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .calculator-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 440px;
      padding: 24px 24px 28px;
      border: 1px solid var(--border);
    }
    .lang-switcher {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 14px;
    }
    .lang-btn {
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      color: #4b5563;
      transition: all 0.15s ease;
    }
    .lang-btn:hover {
      background: #e5e7eb;
    }
    .lang-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      font-weight: 600;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .header p {
      color: var(--muted);
      font-size: 0.875rem;
      margin-top: 6px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #374151;
    }
    .input-wrapper {
      position: relative;
    }
    input[type="number"] {
      width: 100%;
      padding: 12px 48px 12px 14px;
      font-size: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .unit-tag {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      pointer-events: none;
    }
    .btn-calc {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      margin-top: 4px;
    }
    .btn-calc:hover {
      background: var(--primary-hover);
    }
    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 0.875rem;
      padding: 10px 14px;
      border-radius: 8px;
      margin-top: 16px;
      display: none;
    }
    .result-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
      display: none;
    }
    .bmi-value-display {
      font-size: 2.75rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 10px;
      color: #111827;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .badge.underweight {
      background: #e0f2fe;
      color: #0369a1;
    }
    .badge.normal {
      background: #dcfce7;
      color: #15803d;
    }
    .badge.overweight {
      background: #fef3c7;
      color: #b45309;
    }
    .badge.obese {
      background: #fee2e2;
      color: #b91c1c;
    }
    .scale-guide {
      margin-top: 24px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .scale-guide table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .scale-guide td {
      padding: 4px 0;
    }
    .test-shortcuts {
      margin-top: 16px;
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .shortcut-btn {
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.75rem;
      color: #4b5563;
      cursor: pointer;
    }
    .shortcut-btn:hover {
      background: #e5e7eb;
    }
  </style>
</head>
<body>
  <main class="calculator-card">
    <div class="lang-switcher" role="group" aria-label="Language selection">
      <button type="button" class="lang-btn" id="lang-en" onclick="changeLanguage('en')">EN</button>
      <button type="button" class="lang-btn" id="lang-zh-Hant" onclick="changeLanguage('zh-Hant')">繁中</button>
      <button type="button" class="lang-btn" id="lang-ja" onclick="changeLanguage('ja')">日語</button>
    </div>

    <div class="header">
      <h1 data-i18n="title">BMI Calculator 🧮</h1>
      <p data-i18n="subtitle">Body Mass Index Calculator</p>
    </div>

    <form id="bmiForm" novalidate onsubmit="event.preventDefault(); calculateBMI();">
      <div class="form-group">
        <label for="height" data-i18n="labelHeight">Height (50–250 cm)</label>
        <div class="input-wrapper">
          <input type="number" id="height" data-i18n-placeholder="phHeight" step="any">
          <span class="unit-tag">cm</span>
        </div>
      </div>

      <div class="form-group">
        <label for="weight" data-i18n="labelWeight">Weight (10–300 kg)</label>
        <div class="input-wrapper">
          <input type="number" id="weight" data-i18n-placeholder="phWeight" step="any">
          <span class="unit-tag">kg</span>
        </div>
      </div>

      <button type="submit" class="btn-calc" data-i18n="btnCalculate">Calculate</button>
    </form>

    <div id="errorBox" class="error-msg" role="alert"></div>

    <section id="resultSection" class="result-section" aria-live="polite">
      <div data-i18n="yourBmi" style="font-size: 0.85rem; color: var(--muted); margin-bottom: 4px;">Your BMI</div>
      <div id="bmiValue" class="bmi-value-display">--</div>
      <div>
        <span id="bmiCategory" class="badge">--</span>
      </div>
    </section>

    <div class="test-shortcuts">
      <span data-i18n="quickTest" style="font-size: 0.75rem; color: var(--muted); align-self: center;">Quick test:</span>
      <button type="button" class="shortcut-btn" onclick="fillTest(170, 65)">170cm / 65kg</button>
      <button type="button" class="shortcut-btn" onclick="fillTest(160, 50)">160cm / 50kg</button>
      <button type="button" class="shortcut-btn" onclick="fillTest(170, 90)">170cm / 90kg</button>
    </div>

    <div class="scale-guide">
      <div data-i18n="tableTitle" style="font-weight: 600; margin-bottom: 4px;">WHO Standard / Criteria:</div>
      <table>
        <tr><td>&lt; 18.5</td><td data-i18n="catUnderweight">Underweight</td></tr>
        <tr><td>18.5 – 24.9</td><td data-i18n="catNormal">Normal</td></tr>
        <tr><td>25.0 – 29.9</td><td data-i18n="catOverweight">Overweight</td></tr>
        <tr><td>&ge; 30.0</td><td data-i18n="catObese">Obese</td></tr>
      </table>
    </div>
  </main>

  <script>
    const I18N = {
      en: {
        htmlLang: 'en',
        pageTitle: 'BMI Calculator 🧮',
        title: 'BMI Calculator 🧮',
        subtitle: 'Body Mass Index Calculator',
        labelHeight: 'Height (50–250 cm)',
        labelWeight: 'Weight (10–300 kg)',
        phHeight: 'e.g. 170',
        phWeight: 'e.g. 65',
        btnCalculate: 'Calculate',
        yourBmi: 'Your BMI',
        quickTest: 'Quick test:',
        tableTitle: 'WHO Standard / Criteria:',
        catUnderweight: 'Underweight',
        catNormal: 'Normal',
        catOverweight: 'Overweight',
        catObese: 'Obese',
        errEmpty: 'Please enter both height and weight.',
        errPositive: 'Please enter valid positive numbers for height and weight.',
        errHeightRange: 'Height must be between 50 and 250 cm.',
        errWeightRange: 'Weight must be between 10 and 300 kg.'
      },
      'zh-Hant': {
        htmlLang: 'zh-Hant',
        pageTitle: 'BMI 計算器 🧮',
        title: 'BMI 計算器 🧮',
        subtitle: '身體質量指數計算器',
        labelHeight: '身高 (50–250 公分)',
        labelWeight: '體重 (10–300 公斤)',
        phHeight: '例：170',
        phWeight: '例：65',
        btnCalculate: '計算',
        yourBmi: '您的數值',
        quickTest: '快速測試：',
        tableTitle: 'WHO 判讀標準：',
        catUnderweight: '過輕',
        catNormal: '正常',
        catOverweight: '過重',
        catObese: '肥胖',
        errEmpty: '請輸入身高與體重。',
        errPositive: '請輸入大於 0 的有效數值。',
        errHeightRange: '身高須介於 50–250 公分。',
        errWeightRange: '體重須介於 10–300 公斤。'
      },
      ja: {
        htmlLang: 'ja',
        pageTitle: 'BMI 計算機 🧮',
        title: 'BMI 計算機 🧮',
        subtitle: '体格指数（BMI）計算ツール',
        labelHeight: '身長 (50–250 cm)',
        labelWeight: '体重 (10–300 kg)',
        phHeight: '例：170',
        phWeight: '例：65',
        btnCalculate: '計算',
        yourBmi: 'あなたの BMI',
        quickTest: 'クイックテスト：',
        tableTitle: 'WHO 判定基準：',
        catUnderweight: '低体重',
        catNormal: '正常',
        catOverweight: '過体重',
        catObese: '肥満',
        errEmpty: '身長と体重の両方を入力してください。',
        errPositive: '0より大きい有効な数値を入力してください。',
        errHeightRange: '身長は50〜250cmの間で入力してください。',
        errWeightRange: '体重は10〜300kgの間で入力してください。'
      }
    };

    let currentLang = 'en';
    let currentCategoryKey = null;
    let currentErrorKey = null;

    function initLanguage() {
      const stored = localStorage.getItem('bmi_lang');
      if (stored && I18N[stored]) {
        currentLang = stored;
      } else {
        currentLang = 'en';
      }
      applyLanguage(currentLang);
    }

    function changeLanguage(lang) {
      if (!I18N[lang]) return;
      currentLang = lang;
      localStorage.setItem('bmi_lang', lang);
      applyLanguage(lang);
    }

    function applyLanguage(lang) {
      document.documentElement.lang = I18N[lang].htmlLang;
      document.title = I18N[lang].pageTitle;

      // Update switcher buttons
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('lang-' + lang);
      if (activeBtn) activeBtn.classList.add('active');

      // Update all static i18n texts
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (I18N[lang][key] !== undefined) {
          el.textContent = I18N[lang][key];
        }
      });

      // Update input placeholders
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (I18N[lang][key] !== undefined) {
          el.placeholder = I18N[lang][key];
        }
      });

      // Re-translate active category badge if displayed
      if (currentCategoryKey && I18N[lang][currentCategoryKey]) {
        document.getElementById('bmiCategory').textContent = I18N[lang][currentCategoryKey];
      }

      // Re-translate active error box if displayed
      if (currentErrorKey && I18N[lang][currentErrorKey]) {
        document.getElementById('errorBox').textContent = I18N[lang][currentErrorKey];
      }
    }

    function calculateBMI() {
      const heightInput = document.getElementById('height').value.trim();
      const weightInput = document.getElementById('weight').value.trim();
      const errorBox = document.getElementById('errorBox');
      const resultSection = document.getElementById('resultSection');
      const bmiValueEl = document.getElementById('bmiValue');
      const bmiCategoryEl = document.getElementById('bmiCategory');

      errorBox.style.display = 'none';
      errorBox.textContent = '';
      currentErrorKey = null;
      resultSection.style.display = 'none';
      currentCategoryKey = null;

      // 1. Empty check
      if (!heightInput || !weightInput) {
        showError('errEmpty');
        return;
      }

      const height = parseFloat(heightInput);
      const weight = parseFloat(weightInput);

      // 2. NaN / non-positive check
      if (isNaN(height) || isNaN(weight) || height <= 0 || weight <= 0) {
        showError('errPositive');
        return;
      }

      // 3. Plausible range checks
      if (height < 50 || height > 250) {
        showError('errHeightRange');
        return;
      }

      if (weight < 10 || weight > 300) {
        showError('errWeightRange');
        return;
      }

      // 4. Calculate BMI
      const heightM = height / 100;
      const rawBmi = weight / (heightM * heightM);
      const roundedBmi = (Math.round(rawBmi * 10) / 10).toFixed(1);
      const numBmi = parseFloat(roundedBmi);

      let badgeClass = '';

      if (numBmi < 18.5) {
        currentCategoryKey = 'catUnderweight';
        badgeClass = 'underweight';
      } else if (numBmi <= 24.9) {
        currentCategoryKey = 'catNormal';
        badgeClass = 'normal';
      } else if (numBmi <= 29.9) {
        currentCategoryKey = 'catOverweight';
        badgeClass = 'overweight';
      } else {
        currentCategoryKey = 'catObese';
        badgeClass = 'obese';
      }

      bmiValueEl.textContent = roundedBmi;
      bmiCategoryEl.textContent = I18N[currentLang][currentCategoryKey];
      bmiCategoryEl.className = 'badge ' + badgeClass;

      resultSection.style.display = 'block';
    }

    function showError(errorKey) {
      currentErrorKey = errorKey;
      const errorBox = document.getElementById('errorBox');
      errorBox.textContent = I18N[currentLang][errorKey];
      errorBox.style.display = 'block';
    }

    function fillTest(h, w) {
      document.getElementById('height').value = h;
      document.getElementById('weight').value = w;
      calculateBMI();
    }

    // Initialize on page load
    initLanguage();
  </script>
</body>
</html>
